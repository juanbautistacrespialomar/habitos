<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Hábitos</title>
<meta name="description" content="Registro diario de comidas, entrenamientos y cuerpo, con exportación mensual." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.png" type="image/png" />
<meta name="theme-color" content="#8B5CF6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#120F16" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hábitos" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F9F7FC; --surface:#FFFFFF; --surface-2:#F1EDF7;
  --border:#E7E0F0; --text:#241F2E; --muted:#655C73; --faint:#938AA3;
  --primary:#8B5CF6; --primary-strong:#7C3AED; --primary-tint:#F0E9FC;
  --nav-glass:rgba(255,255,255,.72); --nav-active:rgba(139,92,246,.15);
  --shadow:0 1px 2px rgba(36,31,46,.05), 0 8px 24px rgba(36,31,46,.07);
  --shadow-nav:0 -1px 20px rgba(36,31,46,.08);
  --radius:18px; --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#120F16; --surface:#1C1822; --surface-2:#26212E;
  --border:#332C3D; --text:#EEE9F2; --muted:#A99FB3; --faint:#7C7286;
  --primary:#A855F7; --primary-strong:#C084FC; --primary-tint:#251831;
  --nav-glass:rgba(28,24,34,.62); --nav-active:rgba(168,85,247,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-nav:0 -1px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html,body{overflow-x:hidden; overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  height:100vh; height:100dvh;      /* 100vh como red por si el navegador no conoce dvh */
  overflow:hidden;                  /* el BODY no scrollea; el scroll vive en <main> */
  display:flex; flex-direction:column;
  position:relative;                /* ancla de la .bottomnav (position:absolute) */
  transition:background .25s ease, color .25s ease;
}
/* iOS instalado: 100dvh queda corto y la barra "flota"; forzamos el alto real medido por JS */
html.sa body{ height: var(--saH, 100vh); }
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font-family:inherit}

/* ============ APP HEADER ============ */
.appbar{
  flex:0 0 auto; z-index:20;
  padding:calc(var(--safe-top) + 14px) 18px 12px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent;
}
.appbar.scrolled{border-bottom-color:var(--border)}
.brand{display:flex; align-items:center; gap:10px}
.brand .mark{width:32px; height:32px; border-radius:9px; display:block; box-shadow:var(--shadow)}
.brand h1{font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0}
.icon-btn{
  width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--border); color:var(--muted);
  box-shadow:var(--shadow); transition:transform .12s ease;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px; height:20px}

/* ============ DATE NAV ============ */
.datebar{flex:0 0 auto; width:100%; max-width:640px; margin:0 auto}
.datenav{display:flex; align-items:center; justify-content:center; gap:6px; padding:14px 18px 2px}
.datenav .arrow{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  color:var(--muted); background:var(--surface); border:1px solid var(--border);
  transition:transform .12s ease;
}
.datenav .arrow:active{transform:scale(.9)}
.datenav .arrow svg{width:18px;height:18px}
.datenav .label{flex:0 1 auto; text-align:center; min-width:150px; padding:6px 8px}
.datenav .label .d{font-size:17px; font-weight:750; letter-spacing:-.01em; text-transform:capitalize}
.datenav .label .full{font-size:12px; color:var(--faint); margin-top:1px; text-transform:capitalize}
.today-wrap{text-align:center}
.today-pill{
  display:inline-block; margin:2px auto 0; padding:4px 12px; border-radius:999px;
  font-size:12px; font-weight:650; color:var(--primary-strong); background:var(--primary-tint);
}

/* ============ SUMMARY STRIP ============ */
.summary{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:10px 16px 4px}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:10px 8px; text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.stat .top{font-size:9px; font-weight:750; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
.stat .val{font-size:22px; font-weight:820; letter-spacing:-.02em; line-height:1.1; margin-top:3px}
.stat .val small{font-size:12px; font-weight:600; color:var(--faint)}
.stat .bar{position:absolute; left:0; bottom:0; height:3px; background:var(--primary); transition:width .3s ease}

/* ============ SECTIONS / CARDS ============ */
main{ width:100%; max-width:640px; margin:0 auto; flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; padding-bottom:calc(92px + var(--safe-bottom)); }
.view{display:none; padding:8px 16px 24px; animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.section-title{
  font-size:12px; font-weight:750; letter-spacing:.05em; text-transform:uppercase;
  color:var(--faint); margin:20px 4px 10px; display:flex; align-items:center; justify-content:space-between;
}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
}
.card-head{display:flex; align-items:center; gap:10px; padding:14px 16px 6px}
.card-head .dot{width:10px; height:10px; border-radius:50%}
.card-head h3{font-size:16px; font-weight:730; margin:0; letter-spacing:-.01em; flex:1}
.card-head .count{font-size:12px; color:var(--faint); font-weight:650}
.items{padding:2px 16px 6px; display:flex; flex-direction:column; gap:6px}
.item{display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface-2); border-radius:var(--radius-sm); font-size:14.5px}
.item span{flex:1; line-height:1.35; word-break:break-word}
.item button{color:var(--faint); width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none}
.item button:active{background:var(--border)}
.item button svg{width:15px;height:15px}
.empty{padding:0 16px 10px; font-size:13px; color:var(--faint)}
.empty.center{padding:26px 16px; text-align:center}

.add-row{display:flex; gap:8px; padding:6px 12px 14px}
.add-row input{flex:1; padding:11px 14px; border-radius:12px; font-size:15px; background:var(--surface-2); border:1px solid var(--border); color:var(--text)}
.add-row input:focus{outline:none; border-color:var(--primary); background:var(--surface)}
.add-row .add{flex:none; width:46px; border-radius:12px; background:var(--primary); color:#fff; display:grid; place-items:center; transition:transform .12s ease}
.add-row .add:active{transform:scale(.9)}
.add-row .add svg{width:20px;height:20px}

/* ============ AUTOCOMPLETADO DE ALIMENTOS (inline) ============ */
/* El desplegable vive DENTRO de la tarjeta de la comida, justo debajo del input.
   Al estar en el flujo normal del scroll, se mueve con el contenido y nunca queda
   flotando ni bloquea el scroll (evita el bug de position:fixed + teclado en iOS). */
.suggest-inline{padding:0 12px 12px; display:flex; flex-direction:column; gap:3px; animation:suggestIn .14s ease}
.suggest-inline.hidden{display:none}
@keyframes suggestIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
.suggest-inline button{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:11px 12px; border-radius:10px; text-align:left;
  font-size:15px; font-weight:600; color:var(--text); background:var(--surface-2);
}
.suggest-inline button:active{background:var(--border)}
.suggest-inline button span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.suggest-inline button small{flex:none; font-size:11px; font-weight:700; color:var(--faint); background:var(--surface); padding:2px 7px; border-radius:999px}

/* ============ DRINK CHIPS ============ */
.chips{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.chip{position:relative; background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:14px 10px 12px; text-align:center; box-shadow:var(--shadow); transition:transform .1s ease, border-color .15s ease; user-select:none}
.chip:active{transform:scale(.95)}
.chip.on{border-color:var(--c)}
.chip .dico{color:var(--c); line-height:0}
.chip .dico svg{width:27px; height:27px}
.chip .name{font-size:12.5px; font-weight:680; margin-top:5px; color:var(--muted)}
.chip .n{font-size:24px; font-weight:830; letter-spacing:-.02em; margin-top:3px; color:var(--text)}
.chip.on .n{color:var(--c)}
.chip .unit{font-size:10px; color:var(--faint); font-weight:600}
.chip .minus{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:8px; background:var(--surface-2); color:var(--muted); display:none; place-items:center; font-size:16px; font-weight:800}
.chip.on .minus{display:grid}
.chip .minus:active{background:var(--border)}
.chip.add-drink{border-style:dashed; display:grid; place-items:center; color:var(--faint); min-height:104px}
.chip.add-drink .plus{font-size:26px}
.chip.add-drink .t{font-size:11px; font-weight:650; margin-top:2px}

/* ============ SUPPLEMENTS / STEPPERS ============ */
.supp{display:flex; align-items:center; gap:12px; padding:14px 16px}
.supp .dot{width:10px;height:10px;border-radius:50%}
.supp .lbl{flex:1; font-weight:700; font-size:15px}
.stepper{display:flex; align-items:center; background:var(--surface-2); border-radius:12px; border:1px solid var(--border)}
.stepper button{width:38px; height:40px; font-size:20px; font-weight:700; color:var(--muted); display:grid; place-items:center}
.stepper button:active{color:var(--primary)}
.stepper input{width:58px; text-align:center; border:none; background:transparent; color:var(--text); font-size:17px; font-weight:750; -moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.stepper .u{padding-right:12px; font-size:12px; color:var(--faint); font-weight:650}

/* ============ TRAINING ============ */
.train-item{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px}
.train-item .tico{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:none}
.train-item .tico svg{width:23px; height:23px}
.train-item .tbody{flex:1; min-width:0}
.train-item .trow{display:flex; align-items:center; gap:8px}
.train-item .tname{font-weight:730; font-size:15.5px; letter-spacing:-.01em}
.train-item .tmin{font-size:13px; color:var(--muted); font-weight:650}
.train-item .tnote{font-size:13px; color:var(--faint); margin-top:3px; line-height:1.35; word-break:break-word}
.badge{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.train-item .tdel{color:var(--faint); width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none}
.train-item .tdel:active{background:var(--surface-2)}
.train-item .tdel svg{width:15px;height:15px}
.add-big{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; border-radius:var(--radius); border:1.5px dashed var(--border); color:var(--primary-strong); background:var(--surface); font-weight:700; font-size:15px}
.add-big:active{transform:scale(.99)}
.add-big svg{width:20px;height:20px}

/* ============ CUERPO / IMC ============ */
.imc-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 18px; margin-bottom:12px; text-align:center}
.imc-val{font-size:52px; font-weight:850; letter-spacing:-.03em; line-height:1}
.imc-tag{display:inline-block; margin-top:8px; padding:5px 14px; border-radius:999px; font-size:13px; font-weight:700}
.imc-sub{font-size:13px; color:var(--muted); margin-top:10px}
.imc-sub b{color:var(--text)}
.imc-scale{margin-top:16px; height:8px; border-radius:999px; overflow:hidden; display:flex}
.imc-scale div{height:100%}
.imc-marker{position:relative; height:0}
.imc-marker span{position:absolute; top:-4px; width:3px; height:16px; background:var(--text); border-radius:2px; transform:translateX(-50%); box-shadow:0 0 0 2px var(--surface)}
.imc-legend{display:flex; justify-content:space-between; font-size:9.5px; color:var(--faint); margin-top:6px; font-weight:650}
.measure-row{display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px}
.measure-row .lbl{flex:1; font-weight:700; font-size:15px}
.measure-row .v{font-weight:750; font-size:16px}
.measure-row .edit{color:var(--primary-strong); font-weight:700; font-size:13px; padding:6px 10px; border-radius:10px; background:var(--primary-tint)}
.spark{width:100%; height:120px; display:block}
.wlog{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border)}
.wlog:last-child{border-bottom:none}
.wlog .wd{flex:none; width:52px; font-size:12px; color:var(--faint); font-weight:650}
.wlog .wkg{flex:1; font-weight:730; font-size:15px}
.wlog .wimc{font-size:12px; color:var(--muted); font-weight:650}
.wlog .wdel{color:var(--faint); width:26px; height:26px; display:grid; place-items:center; border-radius:8px}
.wlog .wdel svg{width:14px;height:14px}

/* ============ HISTORY ============ */
.hist-item{display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px; width:100%; text-align:left}
.hist-item:active{transform:scale(.99)}
.hist-item .date{flex:none; text-align:center; width:46px}
.hist-item .date .day{font-size:20px; font-weight:820; line-height:1}
.hist-item .date .mon{font-size:10px; text-transform:uppercase; color:var(--faint); font-weight:700; letter-spacing:.04em}
.hist-item .meta{flex:1; min-width:0}
.hist-item .meta .wd{font-size:13px; color:var(--faint); text-transform:capitalize; font-weight:600}
.hist-item .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px}
.tag{font-size:11px; font-weight:650; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.tag.al{background:#FEF3E2; color:#B45309}
.tag.tr{background:var(--primary-tint); color:var(--primary-strong)}
[data-theme="dark"] .tag.al{background:#3A2A12; color:#F0B460}
.hist-item .chev{color:var(--faint)}
.hist-item .chev svg{width:18px;height:18px}

/* ============ DATA VIEW ============ */
.big-btn{display:flex; align-items:center; gap:14px; width:100%; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:11px; text-align:left; transition:transform .1s ease}
.big-btn:active{transform:scale(.99)}
.big-btn .ic{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:none}
.big-btn .ic svg{width:22px;height:22px}
.big-btn .tx{flex:1}
.big-btn .tx .t{font-weight:730; font-size:15.5px}
.big-btn .tx .s{font-size:12.5px; color:var(--faint); margin-top:2px; line-height:1.35}
.big-btn.danger .tx .t{color:#DC2626}
[data-theme="dark"] .big-btn.danger .tx .t{color:#F87171}
.month-select{width:100%; padding:13px 14px; border-radius:14px; margin-bottom:11px; background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:15px; font-weight:600; box-shadow:var(--shadow)}
.data-note{font-size:12.5px; color:var(--faint); line-height:1.5; padding:6px 4px 0; text-align:center}
.data-note b{color:var(--muted)}

/* ============ RESUMEN ============ */
.period-seg{display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:4px; margin:8px 0 14px}
.period-seg button{flex:1; padding:9px; border:none; background:none; color:var(--muted); font-weight:700; font-size:14px; border-radius:10px}
.period-seg button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.streak{display:flex; align-items:center; gap:14px; padding:16px 18px}
.streak .fire{width:46px; height:46px; border-radius:13px; background:var(--primary-tint); color:var(--primary-strong); display:grid; place-items:center; flex:none}
.streak .fire svg{width:26px; height:26px}
.streak .n{font-size:30px; font-weight:850; letter-spacing:-.02em; line-height:1}
.streak .n small{font-size:15px; font-weight:700; color:var(--muted)}
.streak .lb{font-size:13px; color:var(--muted); font-weight:600; margin-top:2px}
.streak .best{margin-left:auto; text-align:right}
.streak .best .v{font-size:18px; font-weight:800}
.streak .best .k{font-size:10.5px; color:var(--faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.res-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.res-stat{background:var(--surface); border:1px solid var(--border); border-radius:15px; box-shadow:var(--shadow); padding:13px 14px}
.res-stat .k{font-size:9.5px; font-weight:750; letter-spacing:.05em; text-transform:uppercase; color:var(--faint)}
.res-stat .v{font-size:26px; font-weight:840; letter-spacing:-.02em; line-height:1.05; margin-top:4px}
.res-stat .v small{font-size:13px; font-weight:600; color:var(--faint)}
.res-stat .sub{font-size:11.5px; color:var(--muted); margin-top:4px; font-weight:600}
.res-pad{padding:16px}
.cal-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px}
.cal-nav .cal-m{flex:1; text-align:center; font-size:15px; font-weight:770; text-transform:capitalize}
.cal-arrow{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); flex:none; transition:transform .12s ease}
.cal-arrow:active{transform:scale(.9)}
.cal-arrow:disabled{opacity:.35}
.cal-arrow svg{width:17px; height:17px}
.cal-legend{display:flex; align-items:center; justify-content:center; gap:5px; margin-top:12px; font-size:10.5px; color:var(--faint); font-weight:600}
.cal-legend i{width:11px; height:11px; border-radius:3px; display:inline-block}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.cal-head .m{font-size:15px; font-weight:760; text-transform:capitalize}
.cal-head .leg{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--faint); font-weight:600}
.cal-head .leg i{width:11px; height:11px; border-radius:3px; display:inline-block}
.cal-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px}
.cal-dow span{text-align:center; font-size:10px; font-weight:700; color:var(--faint)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal-cell{aspect-ratio:1; border-radius:6px; background:var(--surface-2); position:relative}
.cal-cell.today{outline:2px solid var(--primary); outline-offset:1px}
.cal-cell span{position:absolute; inset:0; display:grid; place-items:center; font-size:9px; font-weight:700; color:var(--faint)}
.cal-cell.filled span{color:rgba(255,255,255,.92)}
.cal-note{font-size:12.5px; color:var(--muted); margin-top:12px; line-height:1.45}
.cal-note b{color:var(--text)}
.wd-bars{display:flex; align-items:flex-end; gap:8px; height:120px; padding:6px 4px 0}
.wd-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%}
.wd-track{flex:1; width:100%; display:flex; align-items:flex-end}
.wd-fill{width:100%; border-radius:6px 6px 3px 3px; background:var(--primary)}
.wd-col .bl{font-size:11px; font-weight:700; color:var(--faint)}
.wd-col.wknd .wd-fill{background:var(--primary-strong); opacity:.55}
.wk{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); font-weight:600; margin-top:8px; padding:0 2px}
.wk b{color:var(--text)}

/* ============ BOTTOM NAV — isla flotante ============ */
/* El wrapper es transparente y crea el aire alrededor; la píldora de vidrio
   con sombra es .bottomnav-inner. La pestaña activa se expande y muestra su etiqueta. */
.bottomnav{position:absolute; left:0; right:0; bottom:0; z-index:30; pointer-events:none; background:transparent; padding:0 14px calc(var(--safe-bottom) + 14px)}
.bottomnav-inner{max-width:460px; margin:0 auto; display:flex; pointer-events:auto; background:var(--nav-glass); -webkit-backdrop-filter:blur(22px) saturate(1.6); backdrop-filter:blur(22px) saturate(1.6); border:1px solid var(--border); border-radius:26px; box-shadow:0 6px 24px rgba(16,40,30,.18); padding:6px 8px}
[data-theme="dark"] .bottomnav-inner{box-shadow:0 6px 24px rgba(0,0,0,.45)}
.tab{position:relative; display:flex; align-items:center; justify-content:center; padding:11px 0; background:none; border:none; cursor:pointer; color:var(--faint); flex:0 1 auto; width:46px; min-width:42px; transition:flex-grow .3s ease, width .3s ease, color .25s ease}
.tab span{display:block; font-size:11px; font-weight:700; white-space:nowrap; position:relative; z-index:1; max-width:0; opacity:0; overflow:hidden; transition:max-width .3s ease, opacity .22s ease, margin-left .3s ease}
.tab svg{width:23px; height:23px; position:relative; z-index:1}
.tab.active{color:var(--primary); flex:1 1 auto; width:auto}
.tab.active span{max-width:88px; opacity:1; margin-left:7px}
.tab.active::before{content:""; position:absolute; top:50%; left:50%; width:100%; height:100%; transform:translate(-50%,-50%); background:var(--nav-active); border-radius:16px}

/* ============ MODAL ============ */
.modal-bg{position:fixed; inset:0; z-index:50; background:rgba(10,20,15,.5); display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--surface); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:22px 20px calc(22px + var(--safe-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.25); animation:slideup .25s ease; max-height:90vh; overflow-y:auto}
@keyframes slideup{from{transform:translateY(40px); opacity:.6} to{transform:none; opacity:1}}
.modal h3{margin:0 0 4px; font-size:18px; font-weight:780}
.modal p{margin:0 0 18px; font-size:14px; color:var(--muted); line-height:1.5}
.modal input, .modal .fake-input{width:100%; padding:13px 15px; border-radius:12px; font-size:16px; background:var(--surface-2); border:1px solid var(--border); color:var(--text)}
.modal input:focus{outline:none; border-color:var(--primary)}
.field{margin-bottom:14px}
.field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:0 2px 7px; text-transform:uppercase; letter-spacing:.04em}
.seg{display:flex; gap:8px}
.seg button{flex:1; padding:11px 6px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--border); color:var(--muted); font-weight:680; font-size:14px; display:flex; flex-direction:column; align-items:center; gap:3px}
.seg button .e{line-height:0}
.seg button .e svg{width:22px; height:22px}
.seg button.on{border-color:var(--primary); color:var(--text); background:var(--primary-tint)}
.modal-actions{display:flex; gap:10px; margin-top:4px}
.modal-actions button{flex:1; padding:13px; border-radius:13px; font-size:15px; font-weight:700}
.btn-ghost{background:var(--surface-2); color:var(--muted)}
.btn-primary{background:var(--primary); color:#fff}
.btn-danger{background:#DC2626; color:#fff}

/* ============ TOAST ============ */
/* ============ TOASTS (pila, con la paleta de la app) ============ */
.toasts{position:fixed; left:0; right:0; bottom:calc(96px + var(--safe-bottom)); z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px}
.toastcard{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 15px 10px 12px; border-radius:14px; box-shadow:0 8px 24px rgba(16,40,30,.16); font-size:14px; font-weight:650; max-width:100%; transform:translateY(12px) scale(.96); opacity:0; transition:transform .28s cubic-bezier(.2,.9,.3,1.2), opacity .28s ease}
[data-theme="dark"] .toastcard{box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toastcard.show{transform:none; opacity:1}
.toastcard .tk{flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--primary-tint); color:var(--primary-strong)}
.toastcard .tk svg{width:14px; height:14px}
.toastcard.bad .tk{background:#FEF3E2; color:#B45309}
[data-theme="dark"] .toastcard.bad .tk{background:#3A2A12; color:#F0B460}

/* ============ CARTEL DE ACTUALIZACIÓN ============ */
.update-banner{position:fixed; left:12px; right:12px; top:calc(var(--safe-top) + 10px); z-index:70; display:flex; align-items:center; gap:12px; background:var(--primary); color:#fff; padding:12px 12px 12px 15px; border-radius:16px; box-shadow:0 10px 30px rgba(16,40,30,.3); transform:translateY(-160%); opacity:0; transition:transform .38s cubic-bezier(.2,.9,.3,1.2), opacity .3s ease; max-width:560px; margin:0 auto}
.update-banner.show{transform:translateY(0); opacity:1}
.update-banner .ub-txt{flex:1; display:flex; flex-direction:column; line-height:1.25}
.update-banner .ub-txt b{font-size:14.5px; font-weight:780}
.update-banner .ub-txt span{font-size:12px; opacity:.92}
.update-banner button{flex:none; background:rgba(255,255,255,.24); color:#fff; font-weight:750; font-size:14px; padding:9px 16px; border-radius:11px; transition:background .12s ease}
.update-banner button:active{background:rgba(255,255,255,.36)}
.hidden{display:none !important}
</style>
</head>
<body>

<header class="appbar" id="appbar">
  <div class="brand">
    <img class="mark" src="mark.png" alt="Hábitos" />
    <h1>Hábitos</h1>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"></button>
</header>

<div class="datebar" id="dateBar">
  <div class="datenav">
    <button class="arrow" id="prevDay" aria-label="Día anterior"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="label"><div class="d" id="dateMain">Hoy</div><div class="full" id="dateFull"></div></div>
    <button class="arrow" id="nextDay" aria-label="Día siguiente"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="today-wrap"><button class="today-pill hidden" id="goToday">Volver a hoy</button></div>
</div>

<main>
  <!-- ===== COMIDA ===== -->
  <section class="view active" id="view-comida">
    <div class="summary" id="summary"></div>
    <div id="mealsWrap"></div>
    <div class="section-title">Bebidas</div>
    <div class="chips" id="drinks"></div>
    <div class="section-title">Suplementos</div>
    <div class="card" id="suppCard"></div>
  </section>

  <!-- ===== ENTRENO ===== -->
  <section class="view" id="view-entreno">
    <div class="summary" id="trainSummary"></div>
    <div class="section-title">Entrenamientos del día</div>
    <div id="trainList"></div>
    <button class="add-big" id="addTrain"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Agregar entrenamiento</button>
    <div class="section-title">Descanso</div>
    <div class="card" id="sleepCard"></div>
  </section>

  <!-- ===== CUERPO ===== -->
  <section class="view" id="view-cuerpo">
    <div class="section-title">Índice de masa corporal</div>
    <div id="imcWrap"></div>
    <button class="add-big" id="addWeight" style="margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Registrar peso</button>
    <div id="heightRow"></div>
    <div class="section-title">Evolución del peso</div>
    <div class="card" id="weightTrend"></div>
  </section>

  <!-- ===== RESUMEN ===== -->
  <section class="view" id="view-resumen">
    <div id="resumenWrap"></div>
  </section>

  <!-- ===== DATOS ===== -->
  <section class="view" id="view-datos">
    <div class="section-title">Exportar para analizar</div>
    <select class="month-select" id="monthSelect"></select>
    <button class="big-btn" id="btnCsvMonth">
      <div class="ic" style="background:var(--primary-tint); color:var(--primary-strong)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 13h8M8 17h8M8 9h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="tx"><div class="t">Exportar CSV del mes</div><div class="s">Comida, entrenos y cuerpo. Una fila por registro, listo para tabla dinámica</div></div>
    </button>
    <button class="big-btn" id="btnCsvAll">
      <div class="ic" style="background:var(--surface-2); color:var(--muted)"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 13h8M8 17h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="tx"><div class="t">Exportar CSV completo</div><div class="s">Todo el historial en un solo archivo</div></div>
    </button>

    <div class="section-title">Copia de seguridad</div>
    <button class="big-btn" id="btnBackup">
      <div class="ic" style="background:var(--surface-2); color:var(--muted)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="tx"><div class="t">Descargar backup (JSON)</div><div class="s">Guardá todos tus datos por si cambiás de celular</div></div>
    </button>
    <button class="big-btn" id="btnRestore">
      <div class="ic" style="background:var(--surface-2); color:var(--muted)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9m0 0l-4 4m4-4l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 7V5a1 1 0 011-1h14a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="tx"><div class="t">Restaurar backup</div><div class="s">Importa un archivo JSON y reemplaza los datos actuales</div></div>
    </button>
    <input type="file" id="restoreInput" accept="application/json,.json" class="hidden" />

    <div class="section-title">Instalar</div>
    <button class="big-btn hidden" id="btnInstall">
      <div class="ic" style="background:var(--primary-tint); color:var(--primary-strong)"><svg viewBox="0 0 24 24" fill="none"><rect x="6" y="2" width="12" height="20" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M11 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div class="tx"><div class="t">Instalar en el celular</div><div class="s">Agregá Hábitos a tu pantalla de inicio</div></div>
    </button>
    <div class="data-note" id="installHint"></div>

    <div class="section-title">Zona peligrosa</div>
    <button class="big-btn danger" id="btnReset">
      <div class="ic" style="background:var(--surface-2); color:#DC2626"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-8 0l1 13a1 1 0 001 1h6a1 1 0 001-1l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="tx"><div class="t">Borrar todos los datos</div><div class="s">Elimina todo el historial de este dispositivo</div></div>
    </button>
    <div class="data-note">Los datos viven solo en este dispositivo. <b>Hacé backup seguido.</b></div>
  </section>
</main>

<nav class="bottomnav">
  <div class="bottomnav-inner" id="tabs">
    <button class="tab active" data-view="comida"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3v8a2 2 0 002 2h0v8M6 3v5M9 3v5M18 3c-1.5 0-2.5 2-2.5 5s1 4 2.5 4v9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Comida</span></button>
    <button class="tab" data-view="entreno"><svg viewBox="0 0 24 24" fill="none"><path d="M6.5 8v8M17.5 8v8M4 10v4M20 10v4M6.5 12h11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Entreno</span></button>
    <button class="tab" data-view="resumen"><svg viewBox="0 0 24 24" fill="none"><path d="M5 20V11M12 20V4M19 20v-6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Resumen</span></button>
    <button class="tab" data-view="cuerpo"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M12 8a3 3 0 00-3 3h6a3 3 0 00-3-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Cuerpo</span></button>
    <button class="tab" data-view="datos"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Datos</span></button>
  </div>
</nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
